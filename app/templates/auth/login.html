{% extends "base.html" %}

{% block title %}Sign In - Glenville State Forums{% endblock %}

{% block content %}
  <section class="auth-shell">
    <aside class="auth-brand-panel">
      <img src="{{ url_for('static', filename='images/gsu-header.png') }}" alt="Glenville State University">
      <h1>Welcome back</h1>
      <p>Sign in to follow posts, vote in anonymous polls, and keep up with campus.</p>
    </aside>
    <div class="auth-panel">
    <h1>Sign in</h1>
    <form class="form" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label for="username_or_email">Username or email</label>
      <input id="username_or_email" name="username_or_email" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="button button-primary" type="submit">Sign In</button>
    </form>
    <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
  </div>
  </section>
{% endblock %}
