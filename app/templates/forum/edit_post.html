{% extends "base.html" %}

{% block title %}Edit Post - Glenville State Forums{% endblock %}

{% block content %}
  <section class="composer">
    <h1>Edit post</h1>
    <form class="form" method="post" enctype="multipart/form-data">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <label for="community_id">Community</label>
      <select id="community_id" name="community_id" required>
        {% for community in communities %}
          <option value="{{ community.id }}" {% if post.community_id == community.id %}selected{% endif %}>
            c/{{ community.slug }} - {{ community.name }}
          </option>
        {% endfor %}
      </select>

      <label for="title">Title</label>
      <input id="title" name="title" type="text" maxlength="180" value="{{ post.title }}" required>

      <label for="post_type">Post type</label>
      <select id="post_type" name="post_type">
        {% for type in ["discussion", "question", "poll", "image", "announcement"] %}
          <option value="{{ type }}" {% if post.post_type == type %}selected{% endif %}>{{ type.title() }}</option>
        {% endfor %}
      </select>

      <label for="body">Post</label>
      <textarea id="body" name="body" rows="10" maxlength="5000" required>{{ post.body }}</textarea>
      <div class="char-counter"><span data-count-for="body">0</span>/5000</div>

      {% if post.image_filename %}
        <img class="post-image-thumb" src="{{ url_for('static', filename='uploads/' ~ post.image_filename) }}" alt="Current image for {{ post.title }}">
        <label class="checkbox-row">
          <input name="remove_image" type="checkbox" value="yes">
          Remove current image
        </label>
      {% endif %}

      <label for="image">Replace image</label>
      <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
      <img class="image-preview" alt="Selected image preview" hidden>

      <button class="button button-primary" type="submit">Save Changes</button>
    </form>
  </section>
{% endblock %}
