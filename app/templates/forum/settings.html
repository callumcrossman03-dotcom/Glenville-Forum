{% extends "base.html" %}

{% block title %}Settings - Glenville State Forums{% endblock %}

{% block content %}
  <section class="composer">
    <h1>User Settings</h1>
    <form class="form" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <label for="display_name">Display name</label>
      <input id="display_name" name="display_name" value="{{ current_user.display_name or '' }}" maxlength="80">

      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" rows="4" maxlength="280">{{ current_user.bio or '' }}</textarea>

      <label for="avatar_color">Avatar color</label>
      <input id="avatar_color" name="avatar_color" type="color" value="{{ current_user.avatar_color }}">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ current_user.email }}" required>

      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password">

      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password">

      <button class="button button-primary" type="submit">Save Settings</button>
    </form>
  </section>
{% endblock %}
